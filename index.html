<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧家電訪測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#203c39;font:16px system-ui,"Noto Sans TC",sans-serif}main{max-width:720px;margin:auto;padding:16px 16px 90px}h1{font-size:24px;color:#276953}h2{font-size:19px}section{background:#fff;border:1px solid #dae8e1;border-radius:16px;padding:16px;margin:15px 0}label{display:block;margin:12px 0 6px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #c6d9d1;border-radius:10px;font:inherit}textarea{min-height:100px}details{border:1px solid #d9e8e0;border-radius:12px;margin:9px 0;overflow:hidden}summary{padding:15px;background:#eff6f2;font-weight:700;cursor:pointer}details[open] summary{background:#d9eee2}.inner{padding:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}button{font:inherit;cursor:pointer;border-radius:10px;padding:11px;border:1px solid #b9d4c7;background:white}.chip[aria-pressed=true]{background:#bfe8d0;border-color:#268a59}.bar{position:fixed;bottom:0;background:white;border-top:1px solid #d5e5de;width:100%;left:0;padding:12px;display:flex;justify-content:center;gap:10px}.primary{background:#ef872f;border:0;color:white;font-weight:700}.notice{background:#fff1d9;padding:14px;border-radius:12px}.muted{color:#6b8179;font-size:14px}.entry{border-bottom:1px solid #eee;padding:10px 0}</style><main><h1>🏠 永護寧｜家電訪工作台</h1><div class="notice">研發測試版｜僅可使用模擬個案，不得輸入真實個資。草稿僅儲存於目前瀏覽器。</div><section><h2>① 選擇個案</h2><label>個案</label><select id="case"><option>模擬個案 A</option><option>模擬個案 B</option></select><label>訪視方式</label><select id="type"><option>家訪</option><option>電訪</option></select><label>訪視日期</label><input id="date" type="date"><label>資料來源</label><select id="source"><option>案主口述</option><option>家屬口述</option><option>督導觀察</option><option>服務紀錄</option></select><p class="muted">同一個案每次新增訪視紀錄，不重新建立基本資料。</p></section><section><h2>② 本次訪視模組</h2><p class="muted">選擇下一模組時，上一模組自動收合；已選內容保留。</p><div id="modules"></div><label>本次具體事實與處置</label><textarea id="facts" placeholder="只填寫實際確認的事實，不推測服務成效"></textarea></section><section><h2>③ 生成後人工修改</h2><textarea id="output" aria-label="紀錄內容"></textarea><p id="alert" class="muted"></p></section><section><h2>④ 草稿紀錄</h2><div id="drafts"></div><button id="feedback">保存人工修訂為待審核建議</button><p id="status" class="muted"></p></section></main><div class="bar"><button id="save">儲存草稿</button><button id="generate" class="primary">生成紀錄</button></div><script src="modules.js"></script><script>
const $=s=>document.querySelector(s),key='yhn-demo-drafts-v2',fb='yhn-demo-feedback-v2';let generated='',picked={};
const safe=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
MODULES.forEach(m=>{let d=document.createElement('details');let s=document.createElement('summary');s.textContent=m.name;d.append(s);let div=document.createElement('div');div.className='inner';m.items.forEach(([label,opts])=>{let h=document.createElement('strong');h.textContent=label;div.append(h);let chips=document.createElement('div');chips.className='chips';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.type='button';b.className='chip';b.setAttribute('aria-pressed','false');b.onclick=()=>{let on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));picked[o]=!on};chips.append(b)});div.append(chips)});d.append(div);d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('details').forEach(x=>{if(x!==d)x.open=false})});$('#modules').append(d)});
const drafts=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};
function render(){let arr=drafts();$('#drafts').innerHTML='<p class="muted">已存 '+arr.length+' / 50 筆</p>'+arr.map((d,i)=>'<div class="entry"><b>'+safe(d.case)+'｜'+safe(d.date)+'｜'+safe(d.type)+'</b><p>'+safe(d.text.slice(0,100))+'</p><button data-load="'+i+'">載入</button></div>').join('');document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{$('#output').value=drafts()[Number(b.dataset.load)].text})}
$('#generate').onclick=()=>{let a=Object.keys(picked).filter(x=>picked[x]);let facts=$('#facts').value.trim();if(!a.length&&!facts){alert('請先選擇本次實際情況');return}generated=$('#type').value+'紀錄（'+$('#source').value+'）：'+(a.length?a.join('、')+'。':'')+(facts?facts.replace(/[。！]$/,'')+'。':'');$('#output').value=generated;let alerts=[];a.forEach(x=>RULES.alerts.filter(r=>r.trigger===x).forEach(r=>alerts.push(x+'需確認：'+r.requires.join('、'))));$('#alert').textContent=alerts.join('；')};
$('#save').onclick=()=>{let text=$('#output').value.trim();if(!text)return alert('請先填寫紀錄');let a=drafts();if(a.length>=50)return alert('草稿上限50筆');a.unshift({case:$('#case').value,date:$('#date').value,type:$('#type').value,text});localStorage.setItem(key,JSON.stringify(a));picked={};document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));$('#facts').value='';$('#output').value='';generated='';render();alert('草稿已保存，本次勾選已清空')};
$('#feedback').onclick=()=>{let revised=$('#output').value.trim();if(!generated||!revised||generated===revised){$('#status').textContent='請先生成並修改文字';return}let a=JSON.parse(localStorage.getItem(fb)||'[]');a.push({original:generated,revised,status:'待主管審核'});localStorage.setItem(fb,JSON.stringify(a));$('#status').textContent='修訂建議已保存在本機，未直接修改正式句庫'};
$('#date').value=new Date().toLocaleDateString('en-CA');render();
</script></html>
