<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧｜共用個案選取模擬</title><style>body{font-family:system-ui,sans-serif;background:#f5f8f5;color:#243b30;margin:0}main{max-width:650px;margin:auto;padding:16px}header{background:#286b51;color:white;padding:20px;border-radius:12px}.card{background:white;padding:18px;border-radius:12px;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;min-height:48px;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #bbcbbf;font-size:16px}button{background:#286b51;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}output{display:block;margin:12px 0;overflow-wrap:anywhere}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h2>永護寧｜共用個案選取</h2>純模擬資料｜未連接資料庫｜非正式網站</header><section class="card"><label for="search">搜尋測試個案</label><input id="search" type="search" placeholder="測試代碼或姓名"><label for="caseSelect">選擇個案</label><select id="caseSelect"></select><output id="selected" aria-live="polite"></output></section><section class="card"><strong>共用選取狀態／模組預覽</strong><div class="grid"><button data-module="個案管理">個案管理</button><button data-module="家訪">家訪</button><button data-module="電訪">電訪</button><button data-module="照顧計畫">照顧計畫</button></div><output id="module" aria-live="polite"></output></section></main><script>const cases=[{id:"00000000-0000-4000-8000-000000000001",case_code:"DEMO-001",display_name:"測試個案甲"},{id:"00000000-0000-4000-8000-000000000002",case_code:"DEMO-002",display_name:"測試個案乙"},{id:"00000000-0000-4000-8000-000000000003",case_code:"DEMO-003",display_name:"測試個案丙"}];const q=document.querySelector("#search"),sel=document.querySelector("#caseSelect"),out=document.querySelector("#selected"),mod=document.querySelector("#module");let chosen=cases[0].id;function render(){const rows=cases.filter(c=>(c.case_code+" "+c.display_name).toLowerCase().includes(q.value.trim().toLowerCase()));sel.replaceChildren();for(const c of rows){const o=document.createElement("option");o.value=c.id;o.textContent=c.case_code+"｜"+c.display_name;sel.append(o)}if(!rows.some(c=>c.id===chosen))chosen=rows.length?rows[0].id:null;sel.value=chosen||"";const c=cases.find(x=>x.id===chosen);out.textContent=c?"已選取："+c.display_name+"｜"+c.id:"沒有符合的測試個案";mod.textContent=""}q.addEventListener("input",render);sel.addEventListener("change",()=>{chosen=sel.value;render()});document.querySelectorAll("[data-module]").forEach(b=>b.addEventListener("click",()=>{const c=cases.find(x=>x.id===chosen);mod.textContent=c?b.dataset.module+"｜"+c.display_name+"（"+c.case_code+"）":"請先選取個案"}));render();</script></body></html>
