<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧｜個案讀寫流程模擬</title><style>body{margin:0;background:#f5f8f5;color:#243b30;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:16px}header{background:#286b51;color:white;padding:18px;border-radius:12px}section{background:white;border-radius:12px;padding:16px;margin-top:14px}label{display:block;margin-top:10px}input,select,button{box-sizing:border-box;width:100%;padding:12px;min-height:46px;font-size:16px;border-radius:8px;border:1px solid #b6c8bc;margin-top:6px}button{background:#286b51;color:white}button.secondary{background:#eee;color:#243b30}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}output{display:block;margin:12px 0;overflow-wrap:anywhere}small{display:block} @media(max-width:440px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h2>永護寧｜個案讀寫流程模擬</h2><strong>僅虛構資料｜瀏覽器本機模擬｜不連接任何 API</strong></header><section><label for="caseSelect">共用個案選取</label><select id="caseSelect"></select><label for="code">測試個案代碼</label><input id="code" autocomplete="off"><label for="name">測試個案姓名</label><input id="name" autocomplete="off"><small id="rev"></small><div class="grid"><button id="newCase" class="secondary">新增空白個案</button><button id="save">儲存模擬資料</button><button id="reload" class="secondary">重新讀取</button><button id="reset" class="secondary">重設測試資料</button></div><output id="result" aria-live="polite"></output></section><section><strong>共用模組預覽</strong><div class="grid"><button data-module="個案管理">個案管理</button><button data-module="家訪">家訪</button><button data-module="電訪">電訪</button><button data-module="照顧計畫">照顧計畫</button></div><output id="module"></output></section></main><script>/* MOCK ONLY: no fetch, no backend; localStorage intentionally demonstrates refresh persistence on the SAME browser only. */const KEY="yhn_mock_cases_v1";const initial=[{id:"00000000-0000-4000-8000-000000000001",case_code:"DEMO-001",display_name:"測試個案甲",revision:1},{id:"00000000-0000-4000-8000-000000000002",case_code:"DEMO-002",display_name:"測試個案乙",revision:1}];const $=id=>document.getElementById(id);function read(){try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:structuredClone(initial)}catch{return structuredClone(initial)}}let cases=read(),selected=cases[0]?.id||"",editingRevision=null;function list(){const previous=selected;$("caseSelect").replaceChildren();for(const c of cases){const o=document.createElement("option");o.value=c.id;o.textContent=c.case_code+"｜"+c.display_name;$("caseSelect").append(o)}if(cases.some(c=>c.id===previous))selected=previous;else selected=cases[0]?.id||"";$("caseSelect").value=selected;load()}function load(){const c=cases.find(c=>c.id===selected);$("code").value=c?.case_code||"";$("name").value=c?.display_name||"";editingRevision=c?.revision??0;$("rev").textContent=c?"UUID："+c.id+"｜版本："+c.revision:"新增模式";$("module").textContent=""}function message(s){$("result").textContent=s}function persist(){localStorage.setItem(KEY,JSON.stringify(cases))}function newId(){return crypto.randomUUID()}$("caseSelect").addEventListener("change",e=>{selected=e.target.value;load();message("已選取測試個案")});$("newCase").onclick=()=>{selected="";$("code").value="";$("name").value="";editingRevision=0;$("rev").textContent="新增模式";message("請輸入虛構代碼與名稱")};$("save").onclick=()=>{const code=$("code").value.trim(),name=$("name").value.trim();if(!code||!name)return message("請填寫代碼與名稱");if(cases.some(c=>c.case_code===code&&c.id!==selected))return message("模擬409：代碼重複");let c=cases.find(c=>c.id===selected);if(c){if(c.revision!==editingRevision)return message("模擬409：版本衝突，請重新讀取");c.case_code=code;c.display_name=name;c.revision++}else{c={id:newId(),case_code:code,display_name:name,revision:1};cases.push(c);selected=c.id}persist();list();message("模擬儲存成功｜"+c.case_code+"｜版本 "+c.revision+"。可重新整理後讀取（僅此瀏覽器）。")};$("reload").onclick=()=>{cases=read();list();message("已由本機模擬儲存區重新讀取，非資料庫讀取")};$("reset").onclick=()=>{localStorage.removeItem(KEY);cases=structuredClone(initial);selected=cases[0].id;list();message("已重設本機虛構資料")};document.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>{const c=cases.find(c=>c.id===selected);$("module").textContent=c?b.dataset.module+"｜"+c.display_name+"｜"+c.id:"請先選取個案"});list();</script><script src="./case-field-compat.js"></script><script src="./isolated-v1-client.js"></script><script src="./isolated-v1-ui-binding.js"></script></body></html>
