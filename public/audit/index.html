<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧｜服務時間稽核</title><link rel="stylesheet" href="/audit/audit.css"><script defer src="/vendor/xlsx.full.min.js"></script><script defer src="/vendor/pdf.min.js"></script></head><body><header><a href="/" class="back">← 整合台</a><div><strong>永護寧</strong><span>服務時間稽核</span></div><button id="testAudit" class="outline">空白檢查</button></header><main><section class="intro"><small>逐列比對・不跳行</small><h1>班表、中央紀錄與打卡核對</h1><p>選取三份來源檔後，依日期、個案、居服員逐筆配對；重複資料依原始列序保留並標示人工確認。</p></section><section class="sources" id="sources"></section><section class="mapping panel"><div class="section-head"><div><span class="step">01</span><div><h2>欄位核對</h2><p>自動對應結果可手動修改；必要欄位缺漏會列出，不會推測。</p></div></div><button id="compareBtn" class="primary">開始逐列比對</button></div><div id="mappings" class="mapping-grid"></div></section><section class="results panel"><div class="section-head"><div><span class="step">02</span><div><h2>比對結果</h2><p id="resultSummary">尚未比對</p></div></div><div class="actions"><button id="exportCsv" class="secondary" disabled>匯出 Excel 可貼上 CSV</button><button id="printAudit" class="secondary" disabled>列印清冊</button></div></div><div id="alerts" class="alerts"></div><div class="table-wrap"><table><thead><tr><th>狀態／原因</th><th>服務日期・個案・居服員</th><th>BA碼</th><th>開始</th><th>結束</th><th>服務分鐘</th><th>來源原始列號</th></tr></thead><tbody id="resultRows"><tr><td colspan="7" class="empty">匯入來源後開始比對</td></tr></tbody></table></div></section><section class="panel test"><div class="section-head"><div><span class="step">03</span><div><h2>測試狀態</h2><p id="testResult">本機解析；來源資料不會上傳。</p></div></div></div></section></main><footer>私人測試版｜時間差 1 分鐘以上列異常｜來源內容與列號保留於本機結果</footer><script type="module" src="/audit/audit.js"></script></body></html>
