<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧隔離 API 連線驗證</title><style>body{font:16px system-ui;max-width:640px;margin:30px auto;padding:16px}button{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>隔離 API 連線驗證</h1><p>僅測試站，不含正式個案；此頁不儲存或顯示任何憑證。</p><button id="test">測試同源授權 GET</button><pre id="result">尚未測試</pre><script>document.querySelector('#test').onclick=async()=>{const out=document.querySelector('#result');out.textContent='連線中';try{const r=await fetch('/api/v1/cases',{method:'GET',credentials:'same-origin',headers:{Accept:'application/json'},cache:'no-store'});let d;try{d=await r.json()}catch{d={error:'non_json_response'}}out.textContent='HTTP '+r.status+'\n'+(r.ok?'同源 API 可連線；可見測試個案 '+(d.cases?.length??'?')+' 筆':('錯誤：'+(d.error||'login_or_platform_gate')))}catch(e){out.textContent='網路或瀏覽器阻擋：'+e.name+'。請檢查網址、登入及開發者工具 Network/Console。'}};</script></html>
