<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永護寧｜第二層工作流程測試</title><style>body{font:16px system-ui,"Noto Sans TC";background:#f3f7f5;color:#25433b;margin:0}main{max-width:780px;margin:auto;padding:16px 16px 90px}h1{font-size:23px}section{background:white;border-radius:16px;padding:17px;margin:14px 0;border:1px solid #dce9e3}label{display:block;margin:10px 0 5px;font-weight:700}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;padding:11px;border:1px solid #bbd3c7;border-radius:9px}textarea{min-height:105px}button{font:inherit;padding:11px;border-radius:10px;border:1px solid #aac9b9;background:white;cursor:pointer}.primary{background:#dd7a22;color:white;border:0}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.notice{background:#fff0d8;padding:12px;border-radius:12px}details{border:1px solid #d9e8df;border-radius:12px;margin:8px 0}summary{padding:13px;background:#f1f8f4;cursor:pointer;font-weight:bold}details[open] summary{background:#dceee4}.inner{padding:13px}.chip{margin:4px}.chip[aria-pressed=true]{background:#c6ead6;border-color:#438966}.bottom{position:fixed;bottom:0;background:white;border-top:1px solid #ddd;width:100%;left:0;padding:10px;display:flex;justify-content:center;gap:10px}.small{font-size:13px;color:#607a70}.item{padding:12px 0;border-bottom:1px solid #e8eeea}button:focus-visible,summary:focus-visible{outline:3px solid #20865b}@media print{.bottom,.no-print,.notice{display:none}body{background:white}section{border:0}main{padding:0}}</style><main><h1>🏠 永護寧｜家電訪第二層流程測試</h1><div class="notice">僅供研發驗證，使用模擬個案。資料暫存本機，非正式資料庫；請勿輸入真實個案資訊。</div><section><h2>今日應訪（模擬時程）</h2><div id="schedule"></div></section><section><h2>本次訪視</h2><label>個案</label><select id="case"></select><label>訪視方式</label><select id="type"><option>家訪</option><option>電訪</option></select><label>訪視日期</label><input id="date" type="date"><label>訪視對象</label><select id="respondent"><option>案主本人</option><option>主要照顧者</option><option>其他家屬</option></select><label>資訊來源</label><select id="source"><option>案主口述</option><option>家屬口述</option><option>督導現場觀察</option><option>服務紀錄核對</option></select><p id="history" class="small"></p></section><section><h2>本次情境（自動收合）</h2><div id="modules"></div><label>具體事實、處理內容與必要細節</label><textarea id="facts" placeholder="請輸入實際取得的事實"></textarea><p id="warnings" role="status"></p></section><section><h2>紀錄預覽與人工修改</h2><textarea id="output"></textarea><div class="row no-print"><button id="make">依事實生成</button><button id="save">儲存草稿</button><button id="finish" class="primary">審閱確認完成</button></div></section><section><h2>歷程與草稿</h2><div id="records"></div><div class="row no-print"><button id="export">匯出模擬紀錄 JSON</button><button id="print">列印測試摘要</button></div><p class="small">這不是正式 Word 表單輸出；正式範本的版面及量表仍需獨立驗證。</p></section></main><script src="modules.js"></script><script src="workflow-v2.js"></script></html>
